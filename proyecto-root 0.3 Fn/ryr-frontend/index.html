<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- Firma del Desarrollador -->
  <meta name="author" content="SrAlucart - https://github.com/sralucart">
    <title>MIP PLANS - RyR</title>
  </head>
  <body>
    <div id="particles-js"></div>
    
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    
    <script>
      window.onload = function() {
        particlesJS("particles-js", {
          "particles": { 
            "number": { "value": 70, "density": { "enable": true, "value_area": 800 } }, 
            "color": { "value": "#ffffff" }, 
            "shape": { "type": "circle" }, 
            "opacity": { "value": 0.2, "random": false }, 
            "size": { "value": 3, "random": true }, 
            "line_linked": { "enable": true, "distance": 150, "color": "#ffffff", "opacity": 0.15, "width": 1 }, 
            "move": { "enable": true, "speed": 1.5, "direction": "none", "random": false, "straight": false, "out_mode": "out", "bounce": false } 
          },
          "interactivity": { 
            "detect_on": "canvas", 
            "events": { "onhover": { "enable": true, "mode": "grab" }, "onclick": { "enable": true, "mode": "push" }, "resize": true }, 
            "modes": { "grab": { "distance": 180, "line_linked": { "opacity": 0.4 } }, "push": { "particles_nb": 3 } } 
          },
          "retina_detect": true
        });
      };
    </script>
  </body>
</html>
